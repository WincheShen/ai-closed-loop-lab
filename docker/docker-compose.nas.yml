version: "3.8"

# AI Closed Loop Lab — 群晖 NAS 部署配置
#
# 部署位置: /volume1/docker/ai-lab/
#
# 用法:
#   启动 Web 服务:           sudo docker-compose up -d web
#   启动 Web + 调度器:       sudo docker-compose --profile scheduler up -d
#   启动全部 (含 SMA):       sudo docker-compose --profile scheduler --profile sma up -d
#   查看日志:                sudo docker-compose logs -f web
#   停止:                    sudo docker-compose down

services:
  # ═══════════════════════════════════════════
  # 核心 Web 服务 (React UI + 所有 API)
  # ═══════════════════════════════════════════
  web:
    image: ghcr.io/wincheshen/ai-closed-loop-lab/ai-lab:latest
    container_name: ai-lab-web
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TRADING_AGENT_URL=http://ai-lab-web:8002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════
  # 定时调度器 (盘中复审 / 收盘扫描 / 周复盘)
  # ═══════════════════════════════════════════
  scheduler:
    image: ghcr.io/wincheshen/ai-closed-loop-lab/ai-lab:latest
    container_name: ai-lab-scheduler
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TRADING_AGENT_URL=http://ai-lab-web:8002
    restart: unless-stopped
    command: ["python", "scripts/scheduler.py"]
    profiles:
      - scheduler
    depends_on:
      web:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # Social Media Automation (SMA) — 来自另一个项目
  # ═══════════════════════════════════════════
  sma:
    image: ghcr.io/wincheshen/social-media-automation:latest
    container_name: ai-lab-sma
    ports:
      - "8003:8003"
    volumes:
      - ./data/sma:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - SMA_API_PORT=8003
      - SMA_API_HOST=0.0.0.0
    restart: unless-stopped
    profiles:
      - sma
