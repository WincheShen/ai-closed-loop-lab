version: "3.8"

# AI Closed Loop Lab — 群晖 NAS 部署配置
#
# 部署位置: /volume1/docker/ai-lab/
#
# 用法:
#   启动 Web 服务:           sudo docker-compose up -d web
#   启动 Web + 调度器:       sudo docker-compose --profile scheduler up -d
#   启动全部 (含 SMA):       sudo docker-compose --profile scheduler --profile sma up -d
#   查看日志:                sudo docker-compose logs -f web
#   停止:                    sudo docker-compose down

services:
  # ═══════════════════════════════════════════
  # 核心 Web 服务 (React UI + 所有 API)
  # ═══════════════════════════════════════════
  web:
    image: ai-lab:latest-amd64
    container_name: ai-lab-web
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TRADING_AGENT_URL=http://trading-agent:8001
      - DB_PATH=/app/data/central_brain.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════
  # TradingAgent 个股深度分析服务
  # ═══════════════════════════════════════════
  trading-agent:
    image: ai-lab:latest-amd64
    container_name: ai-lab-trading-agent
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TAS_HOST=0.0.0.0
      - TAS_PORT=8001
      - TAS_ANALYZER=auto
      - DB_PATH=/app/data/central_brain.db
    restart: unless-stopped
    command: ["python", "scripts/run_trading_agent_service.py"]

  # ═══════════════════════════════════════════
  # 定时调度器 (盘中复审 / 收盘扫描 / 周复盘)
  # ═══════════════════════════════════════════
  scheduler:
    image: ai-lab:latest-amd64
    container_name: ai-lab-scheduler
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - TRADING_AGENT_URL=http://trading-agent:8001
      - DB_PATH=/app/data/central_brain.db
      - SMA_BASE_URL=http://ai-lab-sma:8003
    restart: unless-stopped
    command: ["python", "scripts/scheduler.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/app/data/scheduler.heartbeat')<600"]
      interval: 300s
      timeout: 10s
      retries: 2
    profiles:
      - scheduler
    depends_on:
      web:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # Social Media Automation (SMA) — 来自另一个项目
  # ═══════════════════════════════════════════
  sma:
    image: ghcr.io/wincheshen/social-media-automation:latest
    container_name: ai-lab-sma
    ports:
      - "8003:8003"
    volumes:
      - ./data/sma:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - SMA_API_PORT=8003
      - SMA_API_HOST=0.0.0.0
    restart: unless-stopped
    profiles:
      - sma
