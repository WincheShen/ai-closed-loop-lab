# 决策转盘配置 — 事件绑定 + 转盘定义（行为配置层，人审批后改）
#
# 规则（docs/decision_wheel_architecture.md §5）：
# - 只允许"选哪些步骤、什么顺序、填什么参数"，不允许条件表达式；
#   需要逻辑就写成新的 Factor（src/wheel/factors/）并配测试。
# - 未绑定的事件 = 该角色不响应（如隔夜客无 clock.intraday_30m → LLM 复审对它在结构上不存在）。
# - mode: shadow = 转盘只写 wheel_decisions 不执行；live = 经 ExitGateway 执行；off = 关闭。

version: 1

wheels:
  # 常规人格盘中出场：硬止损 / -8% 熔断 / 目标价减仓，止损类退出需二次确认
  exit_confirm:
    kind: decision
    data:    [position, quote_realtime]
    veto:    [floor.trading_day, floor.t_plus_1, floor.real_quote_required]
    propose: [rule.stop_loss, rule.max_loss, rule.target_reduce]
    resolve: priority
    modify:  [mod.stop_confirm, mod.reduce_daily_cap]
    output:  exit_proposal

  # 隔夜极速动量盘中出场：窄止损 + 脉冲止盈，即时执行不二次确认（与回测语义一致）
  exit_confirm_ultra:
    kind: decision
    data:    [position, quote_realtime]
    veto:    [floor.trading_day, floor.t_plus_1, floor.real_quote_required]
    propose: [rule.narrow_stop, rule.pulse_take_profit]
    resolve: priority
    modify:  [mod.reduce_daily_cap]
    output:  exit_proposal

  # 14:30 隔夜持仓强平：满 1 个交易日无条件清仓（无真实行情时 floor 否决，不会假价成交）
  overnight_force_close:
    kind: decision
    data:    [position, quote_realtime]
    veto:    [floor.trading_day, floor.real_quote_required]
    propose: [rule.overnight_expired]
    resolve: priority
    modify:  []
    output:  exit_proposal

  # LLM 盘中复审：LLM 只能提议（priority>=500）；复审里的规则覆盖动作
  # 由 rule.review_override 以规则优先级表达。价值股降噪、最低持仓期、
  # 恰逢止损位的 EXIT 仍需二次确认（堵住 LLM 绕过止损确认的通道）
  llm_position_review:
    kind: decision
    data:    [position, quote_realtime, llm_review]
    veto:    [floor.trading_day, floor.t_plus_1, floor.real_quote_required]
    propose: [rule.review_override, llm.position_review]
    resolve: priority
    modify:  [mod.value_noise_filter, mod.min_hold, mod.stop_confirm, mod.reduce_daily_cap]
    output:  exit_proposal

  # 隔夜客早盘盯盘（Phase 2.4）：09:35 脉冲检查后登记"1 分钟后再看"，
  # 后续事件由 followup.morning_watch 触发同一转盘，直到卖出/截止/次数上限。
  # 与 exit_confirm_ultra 同一套规则；影子模式只记录决策不执行。
  morning_watch:
    kind: decision
    data:    [position, quote_realtime]
    veto:    [floor.trading_day, floor.t_plus_1, floor.real_quote_required]
    propose: [rule.narrow_stop, rule.pulse_take_profit]
    resolve: priority
    modify:  [mod.reduce_daily_cap, mod.watch_followup]
    output:  exit_proposal

  # 市场事件驱动的持仓紧急复审（Phase 2.3）：修复 emergency_review_requested
  # 只写不读的断链。REVIEW 不是卖出动作，网关不执行；影子期只记录
  # "该持仓会被复审"。live 后由 Dispatcher 把 REVIEW 映射到复审入口。
  urgent_review:
    kind: decision
    data:    [position]
    veto:    [floor.trading_day]
    propose: [rule.urgent_review]
    resolve: priority
    output:  urgent_review

  # ── Phase 3：入场侧转盘 ────────────────────────────────────
  # 3.1 隔夜客 14:35 尾盘狙击漏斗（写 wheel_candidates）+ 单票确认（送 EntryGateway）
  market_screen_ultra:
    kind: funnel
    data:    [watchlist_ultra]
    steps:   [screen.cold_and_weather_gate, screen.watchlist_ttl]
    output:  candidates

  entry_confirm_ultra:
    kind: decision
    data:    [candidate_intraday]
    veto:    [floor.trading_day, veto.cold_period, floor.real_quote_required]
    propose: [detector.ultra_tail_momentum]
    resolve: priority
    modify:  []
    output:  entry_proposal

  # 3.2 次日开盘价成交（09:31–09:35）：校验今日行情 + 跳空保护（高开>3%/破止损/涨跌停放弃）
  order_fill_at_open:
    kind: decision
    data:    [pending_signal, quote_realtime]
    veto:    [floor.trading_day, veto.quote_fresh_today, veto.open_gap_guard]
    propose: [rule.fill_at_open]
    resolve: priority
    modify:  [mod.portfolio_position_cap]
    output:  entry_proposal

  # 3.3 盘中条件单触发（breakout / pullback）
  pending_trigger:
    kind: decision
    data:    [pending_signal, quote_realtime]
    veto:    [floor.trading_day, floor.real_quote_required, veto.signal_price_anomaly, veto.stock_cooldown_and_suspend]
    propose: [rule.pending_condition_met]
    resolve: priority
    modify:  [mod.portfolio_position_cap]
    output:  entry_proposal

  # 3.4 短线/价值日度选股漏斗（写 wheel_candidates）+ 单票入场确认（送 EntryGateway）
  market_screen:
    kind: funnel
    data:    [explorer_scan]
    steps:   [screen.regime_posture_gate, screen.shared_flags_and_blacklist]
    output:  candidates

  entry_confirm:
    kind: decision
    data:    [strategist_eval, account_monitor]
    veto:    [floor.trading_day, veto.account_daily_loss]
    propose: [llm.signal_propose]
    resolve: priority
    modify:  [mod.consecutive_loss_throttle, mod.portfolio_position_cap]
    output:  entry_proposal

  # 3.8 & 4b 记忆类与复盘提议转盘
  attribution:
    kind: decision
    data:    [position]
    veto:    []
    propose: [rule.memory_update(task=attribution)]
    resolve: priority
    modify:  []
    output:  memory_update

  watchlist_maintain:
    kind: decision
    data:    []
    veto:    [floor.trading_day]
    propose: [rule.memory_update(task=watchlist_maintain)]
    resolve: priority
    modify:  []
    output:  memory_update

  weekly_reflection:
    kind: decision
    data:    []
    veto:    []
    propose: [rule.memory_update(task=weekly_reflection)]
    resolve: priority
    modify:  []
    output:  memory_update

personas:
  short_term_hot_rotation_v1:
    kind: short
    bindings:
      clock.intraday_5m:  { wheel: exit_confirm, mode: live }
      clock.intraday_30m: { wheel: llm_position_review, mode: live }
      market.regime_drift: { wheel: urgent_review, mode: shadow }
      clock.next_open:    { wheel: order_fill_at_open, mode: live }
      clock.pending_5m:   { wheel: pending_trigger, mode: live }
      clock.1535:         { chain: [market_screen, entry_confirm], mode: live }
      position.closed:    { wheel: attribution, mode: live }
      clock.1530:         { wheel: watchlist_maintain, mode: live }
      clock.weekly:       { wheel: weekly_reflection, mode: live }

  ultra_short_momentum_v1:
    kind: ultra
    bindings:
      clock.intraday_5m:  { wheel: exit_confirm_ultra, mode: live }
      clock.0935:         { wheel: morning_watch, mode: shadow }
      followup.morning_watch: { wheel: morning_watch, mode: shadow }
      clock.1430:         { wheel: overnight_force_close, mode: live }
      clock.1435:         { chain: [market_screen_ultra, entry_confirm_ultra], mode: live }
      position.closed:    { wheel: attribution, mode: live }
      clock.1530:         { wheel: watchlist_maintain, mode: live }
      clock.weekly:       { wheel: weekly_reflection, mode: live }
      # 无 clock.intraday_30m 与 market.regime_drift 绑定 — LLM 复审对隔夜客在结构上不存在

  duan_yongping_v1:
    kind: value
    bindings:
      clock.intraday_5m:  { wheel: exit_confirm, mode: live }
      clock.intraday_30m: { wheel: llm_position_review, mode: live }
      market.regime_drift: { wheel: urgent_review, mode: shadow }
      clock.next_open:    { wheel: order_fill_at_open, mode: live }
      clock.pending_5m:   { wheel: pending_trigger, mode: live }
      clock.1535:         { chain: [market_screen, entry_confirm], mode: live }
      position.closed:    { wheel: attribution, mode: live }
      clock.weekly:       { wheel: weekly_reflection, mode: live }

  warren_buffett_v1:
    kind: value
    bindings:
      clock.intraday_5m:  { wheel: exit_confirm, mode: live }
      clock.intraday_30m: { wheel: llm_position_review, mode: live }
      market.regime_drift: { wheel: urgent_review, mode: shadow }
      clock.next_open:    { wheel: order_fill_at_open, mode: live }
      clock.pending_5m:   { wheel: pending_trigger, mode: live }
      clock.1535:         { chain: [market_screen, entry_confirm], mode: live }
      position.closed:    { wheel: attribution, mode: live }
      clock.weekly:       { wheel: weekly_reflection, mode: live }
